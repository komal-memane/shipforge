apiVersion: apps/v1
kind: Deployment
metadata:
  name: shipforge-product-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: shipforge-product-service
  template:
    metadata:
      labels:
        app: shipforge-product-service
    spec:
      containers:
        - name: product-service
          image: shipforge-product-service:1.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000
          env:
            - name: DB_HOST
              value: shipforge-postgres
            - name: DB_PORT
              value: "5432"
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: shipforge-db-secret
                  key: POSTGRES_USER
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: shipforge-db-secret
                  key: POSTGRES_PASSWORD
            - name: DB_NAME
              valueFrom:
                secretKeyRef:
                  name: shipforge-db-secret
                  key: POSTGRES_DB
          readinessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 20

---
apiVersion: v1
kind: Service
metadata:
  name: shipforge-product-service
spec:
  selector:
    app: shipforge-product-service
  ports:
    - port: 3000
      targetPort: 3000
  type: ClusterIP