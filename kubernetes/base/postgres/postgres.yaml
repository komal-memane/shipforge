apiVersion: apps/v1
kind: Deployment
metadata:
  name: shipforge-postgres
spec:
  replicas: 1

  selector:
    matchLabels:
      app: shipforge-postgres

  template:
    metadata:
      labels:
        app: shipforge-postgres

    spec:
      containers:
        - name: postgres
          image: postgres:16
          imagePullPolicy: IfNotPresent

          ports:
            - containerPort: 5432

          env:
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: shipforge-db-secret
                  key: POSTGRES_USER

            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: shipforge-db-secret
                  key: POSTGRES_PASSWORD

            - name: POSTGRES_DB
              valueFrom:
                secretKeyRef:
                  name: shipforge-db-secret
                  key: POSTGRES_DB

          volumeMounts:
            - name: postgres-storage
              mountPath: /var/lib/postgresql/data
              subPath: postgres

      volumes:
        - name: postgres-storage
          persistentVolumeClaim:
            claimName: shipforge-postgres-pvc

---
apiVersion: v1
kind: Service
metadata:
  name: shipforge-postgres
spec:
  selector:
    app: shipforge-postgres

  ports:
    - port: 5432
      targetPort: 5432

  type: ClusterIP