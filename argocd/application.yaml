apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: shipforge-dev
  namespace: argocd
spec:
  project: default

  source:
    repoURL: https://github.com/komal-memane/shipforge.git
    targetRevision: main
    path: kubernetes/overlays/dev

  destination:
    server: https://kubernetes.default.svc
    namespace: default

  syncPolicy:
    automated:
      selfHeal: true
      prune: false
    syncOptions:
      - CreateNamespace=false
